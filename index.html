  <style>
    html, body { background: #f3f5f8; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      color: #1e2128;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'ss01', 'cv11';
      letter-spacing: -0.011em;
      min-height: 100vh;
    }

    .font-serif { font-family: 'Instrument Serif', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .text-balance { text-wrap: balance; }
    .text-pretty { text-wrap: pretty; }

    /* Tight tracking for big display text */
    .tracking-tighter-2 { letter-spacing: -0.04em; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f3f5f8; }
    ::-webkit-scrollbar-thumb { background: #c4baa3; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #969fad; }

    input:focus, button:focus, select:focus, textarea:focus { outline: none; }

    /* Range slider — clean light style */
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track {
      height: 2px; background: #cdd3dc; border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #111318;
      margin-top: -7px; cursor: pointer;
      box-shadow: 0 0 0 4px rgba(12,11,9,0.08);
    }
    input[type=range]::-moz-range-track {
      height: 2px; background: #cdd3dc; border-radius: 2px;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border: none;
      border-radius: 50%; background: #111318; cursor: pointer;
    }

    /* Subtle animation on load */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards; }

    /* Italic serif underline accent like NeoVision */
    .italic-accent {
      font-style: normal;
      font-weight: 700;
      color: #0050b0;
      text-decoration: underline;
      text-decoration-color: #c0d000;
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.15em;
    }

    /* Modal backdrop */
    .modal-backdrop {
      background: rgba(12, 11, 9, 0.55);
      backdrop-filter: blur(6px);
    }

    /* Hover-lift on cards */
    .card-hover { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -12px rgba(12,11,9,0.12); }

    /* Subtle dotted bg for hero accent */
    .dot-grid {
      background-image: radial-gradient(circle, #cdd3dc 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* No tap highlight */
    button, a { -webkit-tap-highlight-color: transparent; }
